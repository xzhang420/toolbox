[metadata]
name = lumacam-pipeline
version = 0.4.0
description = Independent LumaCam processing and analysis/visualization workflows
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23,<3
    scipy>=1.9,<2
    pandas>=1.5,<3
    tifffile>=2022.8
    matplotlib>=3.5.1,<4
    astropy>=5,<8
    Pillow>=9
    matplotlib-scalebar>=0.8,<1

[options.packages.find]
where = src

[options.extras_require]
notebook =
    jupyterlab>=4,<5
    ipywidgets>=8,<9
fits =

[options.entry_points]
console_scripts =
    lumacam = lumacam_pipeline.cli:main
