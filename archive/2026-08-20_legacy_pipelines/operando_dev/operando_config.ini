[general]
base_dir = /path/to/proposal
echem_folder =
result_root = analysis
skip_pipeline_if_corrected_exists = true

[obint_correction.parameters]
# New proposals use data/experiments; early data/experiment proposals remain supported.
exp_dir = data/experiments/final/experiment_name/3to1000
beamhistory_path =
reference_dir =
reference_beamhistory_path =
reference_bin_y = 2
reference_bin_x = 2
reference_final_subfolder = final
reference_thickness_um = 1.0
file_filter = 
# Legacy fallback only; version-2 JSON metadata provides acquisition timing.
tpx_time = 2
n_tpx_per_image = 30
recompute_obint = false

[background_processing.parameters]
enabled = false
background_n_images = 7
recompute_background = false
recompute_final = false
clip_negatives = true

[data_preview.parameters]
conv_thickness = 3.66
thickness_capacity_mode = current_sign_half_cycle
time_column = time/s
frames_per_merge = 1
spatial_pixel_merge = 1
merge_method = mean
pause_gap_minutes = 8.0
roi_large_r0 = 160
roi_large_x0 = 221
roi_large_y0 = 222
roi_small_r0 = 111
roi_small_x0 = 221
roi_small_y0 = 222
plot_thickness = true
thickness_traces = nci
thickness_layout = separate
overlay_offset_fraction = 0.0
nci_metric = average_thickness
lithium_density_g_cm3 = 0.463
plot_cmap = inferno
plot_vmin = 0.0
plot_vmax = 3.0
plot_cbar_mode = shared left
plot_cbar_ticks = 4
preview_morphology_3d = false
pixel_size = 55.0
scalebar_length = 5000.0
scale_label = 5 mm
surface_stride = 2
surface_elev = 35
surface_azim = -60

[plating_metrics.parameters]
enabled = true
threshold_fraction = 0.05
threshold_abs = 

[selection.parameters]
manual_selected_indices = 12, 67, 131, 194, 260, 285, 297, 340, 349, 414, 449
manual_cycle_numbers = 
show_cycle_numbers = true
show_nci_thickness = true
snap_markers_to_tips = true
tip_snap_tolerance_seconds = 300

[video.parameters]
fps = 10
dt_seconds = 120
video_dpi = 150
video_plot_thickness = false
video_thickness_traces = nci
video_thickness_layout = overlay
video_overlay_offset_fraction = 0.0
video_cmap = inferno
video_vmin = 0.0
video_vmax = 1.5
video_cbar_ticks = 5
